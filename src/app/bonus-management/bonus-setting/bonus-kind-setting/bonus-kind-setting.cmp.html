@if (loading) {
    <div class="loading-row">
      <mat-spinner diameter="32"></mat-spinner>
    </div>
  } @else {
    <section class="bonus-setting-section">
      <div class="bonus-setting-label">
        賞与の設定
      </div>
      <div class="import-file-setting">
          <div class="import-file-setting-content">
              賞与の種別を追加できます。
          </div>
  
        @for (item of types; track $index) {
          <div class="type-row">
            <label class="type-label">賞与種別#{{ $index + 1 }}</label>
            <mat-form-field appearance="outline" class="label-field">
              <mat-label>表示名</mat-label>
              <input matInput [(ngModel)]="item.label" placeholder="定期賞与" />
            </mat-form-field>
            <mat-form-field appearance="outline" class="category-field">
              <mat-label>頻度区分</mat-label>
              <mat-select [(ngModel)]="item.bonusFrequency">
                <mat-option value="low">年4回未満</mat-option>
                <mat-option value="high">年4回以上</mat-option>
              </mat-select>  
            </mat-form-field>
          </div>
        }
    
        <button mat-stroked-button type="button" class="add-type-button" (click)="addType()">
          種別を追加
        </button>
    
        @if (validationError) {
          <p class="validation-error">{{ validationError }}</p>
        }
    
        <div class="actions">
          <button
            mat-flat-button
            color="primary"
            type="button"
            [disabled]="saveBusy"
            (click)="save()"
          >
            @if (saveBusy) {
              <mat-spinner diameter="20"></mat-spinner>
            } @else {
              保存
            }
          </button>
        </div>
      </div>
    </section>
  }
