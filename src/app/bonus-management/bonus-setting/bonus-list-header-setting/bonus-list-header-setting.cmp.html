@if (loading) {
  <div class="loading-row">
    <mat-spinner diameter="32"></mat-spinner>
  </div>
} @else {
  <section class="header-setting-section">
    <div class="bonus-setting-label">
      賞与一覧の表示項目
    </div>

    <p class="order-hint">
      チェックした項目が一覧に表示されます。ドラッグで並び順を変更できます。
    </p>

    <mat-checkbox
      [checked]="isAllSelected()"
      (change)="toggleAll($event.checked)"
    >
      @if (isAllSelected()) {
        すべて解除
      } @else {
        すべて選択
      }
    </mat-checkbox>

    <div cdkDropList class="column-order-list" (cdkDropListDropped)="drop($event)">
      @for (col of orderedColumns; track col.key) {
        <div class="column-order-row" cdkDrag>
          <mat-icon cdkDragHandle class="drag-handle">drag_indicator</mat-icon>
          <mat-checkbox [(ngModel)]="col.checked" (ngModelChange)="onCheckedChange()">
            {{ col.label }}
          </mat-checkbox>
        </div>
      }
    </div>

    <div class="actions">
      <button
        mat-flat-button
        color="primary"
        type="button"
        [disabled]="saveBusy"
        (click)="save()"
      >
        @if (saveBusy) {
          <mat-spinner diameter="20"></mat-spinner>
        } @else {
          保存
        }
      </button>
    </div>
  </section>
}
