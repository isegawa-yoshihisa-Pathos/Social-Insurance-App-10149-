<h2 mat-dialog-title>
  @if (data.selectedCount === 1) {
    {{ data.label }}
  } @else {
    {{ data.label }}を一括編集
  }
</h2>

<div mat-dialog-content>
  @if (data.selectedCount === 1) {
    <p>
      {{ data.displayName }}
      @if (data.employeeId) {
        <span class="employee-id">（{{ data.employeeId }}）</span>
      }
      の値を編集します。
    </p>
  } @else {
    <p>{{ data.selectedCount }}名に同じ値を反映します。</p>
  }

  <mat-form-field appearance="outline" style="width: 100%;">
    <mat-label>{{ data.label }}</mat-label>
    <input matInput type="number" [(ngModel)]="numberValue" />
  </mat-form-field>
</div>

<div mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="undefined">キャンセル</button>
  <button mat-flat-button color="primary" (click)="save()">保存</button>
</div>
