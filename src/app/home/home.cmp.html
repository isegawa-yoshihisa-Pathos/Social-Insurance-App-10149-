<div class="home">
    <div class="home-content">
        <div class="text-container">
            <div class="text-content">
                <p>縄文<mat-icon>trending_up</mat-icon>を使って</p>
                <p>社会保険料関連業務をスムーズに</p>
            </div>
        </div>
        <div class="button-container">
            <div class="signup-container">
                <p>初めてご利用の方はこちら</p>
                <button mat-flat-button class="signup-button" (click)="navigateToSignup()">
                    アカウントを作成
                </button>
            </div>
            <div class="signin-container">
                <p>すでにアカウントをお持ちの方はこちら</p>
                <button matButton="outlined" class="signin-button" (click)="navigateToSignin()">
                    ログイン
                </button>
            </div>
        </div>
    </div>
</div>
