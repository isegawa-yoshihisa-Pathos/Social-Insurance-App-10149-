<div class="signin">
    <div class="pane">
        <div class="input-container">
            <label class="subtitle">ログイン</label>
            <mat-form-field appearance="outline" class="field" subscriptSizing="dynamic">
                <mat-label>メールアドレス</mat-label>
                <input 
                    matInput 
                    type="email" 
                    placeholder="sample@example.com" 
                    name="email" 
                    autocomplete="username" 
                    required
                />
            </mat-form-field>
            <mat-form-field appearance="outline" class="field" subscriptSizing="dynamic">
                <mat-label>パスワード</mat-label>
                <input 
                    matInput 
                    type="password" 
                    placeholder="********" 
                    name="password" 
                    autocomplete="current-password" 
                    required
                />
            </mat-form-field>
        </div>
        <div class="button-container">
            <button mat-flat-button color="primary" type='submit'>ログイン</button>
            <label class="message">アカウントがない方はこちら</label>
            <button matButton="outlined">アカウント作成</button>
        </div>
    </div>
</div>
