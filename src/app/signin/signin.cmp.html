<div class="signin">
    <div class="pane">
        <div class="input-container">
            <label class="subtitle">ログイン</label>
            <mat-form-field appearance="outline" class="field" subscriptSizing="dynamic">
                <mat-label>会社名</mat-label>
                <mat-select class="establishments-select" name="establishment">
                    <mat-select-trigger>
                        <span>会社名1</span>
                    </mat-select-trigger>
                    <mat-option value="establishment">会社名1</mat-option>
                    <mat-option value="establishment">会社名2</mat-option>
                    <mat-option value="establishment">会社名3</mat-option>
                </mat-select>
            </mat-form-field>
            <mat-form-field appearance="outline" class="field" subscriptSizing="dynamic">
                <mat-label>メールアドレス</mat-label>
                <input 
                    matInput 
                    type="email" 
                    placeholder="sample@example.com" 
                    name="email" 
                    autocomplete="username" 
                    required
                />
            </mat-form-field>
            <mat-form-field appearance="outline" class="field" subscriptSizing="dynamic">
                <mat-label>パスワード</mat-label>
                <input 
                    matInput 
                    type="password" 
                    placeholder="********" 
                    name="password" 
                    autocomplete="current-password" 
                    required
                />
            </mat-form-field>
        </div>
        <div class="button-container">
            <button mat-flat-button color="primary" class="signin-button" type='submit'>ログイン</button>
        </div>
    </div>
</div>
