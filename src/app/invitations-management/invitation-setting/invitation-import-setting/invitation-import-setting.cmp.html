<div class="invitation-setting-content">
    <div class="invitation-setting-label">
        CSVファイルインポート設定
    </div>
    <div class="import-file-setting">
        <div class="import-file-setting-content">
            <p>ヘッダー名を指定してください。</p>
            <p>指定されたヘッダー名は、CSVファイルの1行目に記述されたヘッダー名と一致する必要があります。</p>
        </div>
        <div class="header-setting">
            <label class="current-header">名前ヘッダー名：<span class="header-label">{{ invitationDataService.nameHeader() }}</span></label>
            <div class="header-setting-row">
                <mat-form-field appearance="outline" class="header-input">
                    <mat-label>新しいヘッダー</mat-label>
                    <input matInput [(ngModel)]="newNameHeader" />
                </mat-form-field>
                <button matButton="outlined" type="button" (click)="changeNameHeader()">
                    変更
                </button>
            </div>
        </div>
        <div class="header-setting">
            <label class="current-header">メールアドレスヘッダー名：<span class="header-label">{{ invitationDataService.emailHeader() }}</span></label>
            <div class="header-setting-row">
                <mat-form-field appearance="outline" class="header-input">
                    <mat-label>新しいヘッダー</mat-label>
                    <input matInput [(ngModel)]="newEmailHeader" />
                </mat-form-field>
                <button matButton="outlined" type="button" (click)="changeEmailHeader()">
                    変更
                </button>
            </div>
        </div>
    </div>
</div>
