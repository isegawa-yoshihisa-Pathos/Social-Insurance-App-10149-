<div class="search-container" style="display: flex; gap: 12px; margin-bottom: 16px;">
  <mat-form-field appearance="outline">
    <mat-label>検索項目</mat-label>
    <mat-select [(ngModel)]="searchTargetColumn" (ngModelChange)="search()">
      @for (col of visibleColumns(); track col) {
        <mat-option [value]="col">{{ getColumnLabel(col) }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" style="flex: 1;">
    <mat-label>検索ワード</mat-label>
    <input
      matInput
      [(ngModel)]="searchQuery"
      (ngModelChange)="search()"
      placeholder="キーワードを入力"
    />
  </mat-form-field>
</div>

@if (loading) {
  <p class="loading-message">社員を読み込んでいます...</p>
} @else if (dataSource.data.length === 0) {
  <p class="empty-message">社員はありません。</p>
} @else {
  <div class="table-scroll-container">
    <table mat-table [dataSource]="dataSource" matSort class="employees-table">
      <ng-container matColumnDef="selected">
        <th mat-header-cell *matHeaderCellDef class="check-col">
          <mat-checkbox
            [checked]="isAllSelectedInView()"
            (change)="toggleAllInView($event.checked)"
          />
        </th>
        <td mat-cell *matCellDef="let row" class="check-col" (click)="$event.stopPropagation()">
          <mat-checkbox
            [checked]="isSelected(row.eid)"
            (change)="toggleSelection(row.eid, $event.checked)"
          />
        </td>
      </ng-container>

      @for (col of visibleColumns(); track col) {
        <ng-container matColumnDef="{{ col }}">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            {{ getColumnLabel(col) }}
          </th>
          <td mat-cell *matCellDef="let row" (click)="onCellClick(row, col)">
            {{ row[col] }}
          </td>
        </ng-container>
      }

      <tr mat-header-row *matHeaderRowDef="tableColumns()"></tr>
      <tr mat-row *matRowDef="let row; columns: tableColumns();" class="employee-row"></tr>
    </table>
  </div>
}
