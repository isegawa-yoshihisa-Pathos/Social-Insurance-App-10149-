<div class="employee-detail-header">
    <h2 class="employee-name">{{ dataService.personalForm.displayName || '氏名未設定' }}</h2>
    @if (dataService.employForm.employeeId) {
        <p class="employee-id">社員番号：{{ dataService.employForm.employeeId }}</p>
    }
</div>

<nav mat-tab-nav-bar [tabPanel]="tabPanel" animationDuration="0ms" class="setting-tabs">
    <a
        mat-tab-link
        [routerLink]="['/employees-management', 'detail', eid, 'employ']"
        [active]="isActive === 'employ'"
    >
        <span>雇用情報</span>
    </a>
    <a
        mat-tab-link
        [routerLink]="['/employees-management', 'detail', eid, 'status']"
        [active]="isActive === 'status'"
    >
        <span>勤務情報</span>
    </a>
    <a 
        mat-tab-link
        [routerLink]="['/employees-management', 'detail', eid, 'personal']"
        [active]="isActive === 'personal'"
    >
        <span>個人情報</span>
    </a>
</nav>

<mat-tab-nav-panel #tabPanel>
    <div class="setting-page">
        @if (dataService.loading) {
            <mat-spinner diameter="40"></mat-spinner>
        } @else {
            <router-outlet />
        }
    </div>
</mat-tab-nav-panel>
