<mat-toolbar class="app-shell-toolbar">
    <button class="jomon-logo-button" (click)="navigateToHome()">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=moving" />
        縄文<span class="material-symbols-outlined">moving</span>
    </button>
    @if (!auth.currentUser) {
        <div class="button-container">
            <div class="signup-container">
                <p class="signup-text">初めてご利用の方はこちら</p>
                <button mat-flat-button class="signup-button" (click)="navigateToSignup()">
                    利用を開始する
                </button>   
            </div>
            <button matButton="outlined" class="signin-button" (click)="navigateToSignin()">
                ログイン
            </button>
        </div>
    } @else {
        <div class="button-container">
            <button mat-button class="tenant-name" [matMenuTriggerFor]="tenantMenu">
                <span>{{ currentAffiliation()?.tenantName ?? '事業所未選択' }}</span>
                <mat-icon>arrow_drop_down</mat-icon>
            </button>
            <mat-menu #tenantMenu="matMenu">
                @for (aff of currentTenantService.getAffiliations(); track aff.tid) {
                    <button mat-menu-item type="button" (click)="switchTenant(aff.tid)"
                    [disabled]="aff.tid === currentTenantService.getTenant()">
                        {{ aff.tenantName }}
                    </button>
                }
            </mat-menu>
            <button mat-button class="notification-button">
                <mat-icon>notifications</mat-icon>
                <mat-icon>arrow_drop_down</mat-icon>
            </button>
            <button mat-button class="user-name" [matMenuTriggerFor]="accountMenu">
                <span class="user-name-text">{{ currentAffiliation()?.displayName || 'ユーザー名未設定' }}</span>
                <mat-icon>arrow_drop_down</mat-icon>
            </button>
            <mat-menu #accountMenu="matMenu" class="account-menu">
                <button mat-menu-item type="button" >通知</button>
                <button mat-menu-item type="button" (click)="navigateToPersonalSetting()">個人設定</button>
                <button mat-menu-item type="button" (click)="signOut()">サインアウト</button>
            </mat-menu>
        </div>
    }
</mat-toolbar>
