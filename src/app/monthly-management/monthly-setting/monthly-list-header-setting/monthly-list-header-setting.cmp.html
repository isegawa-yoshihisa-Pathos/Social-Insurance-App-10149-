@if (loading) {
  <div class="loading-row">
    <mat-spinner diameter="32"></mat-spinner>
  </div>
} @else {
  <section class="header-setting-section">
    <h2 class="section-title">月次一覧の表示項目</h2>

    <div class="checkbox-row disabled">
      <mat-checkbox [checked]="true" [disabled]="true">氏名（必須）</mat-checkbox>
    </div>

    @for (col of optionalColumns; track col.key) {
      <div class="checkbox-row">
        <mat-checkbox
          [checked]="isChecked(col.key)"
          (change)="onOptionalChange(col.key, $event.checked)"
        >
          {{ col.label }}
        </mat-checkbox>
      </div>
    }

    <div class="actions">
      <button
        mat-flat-button
        color="primary"
        type="button"
        [disabled]="saveBusy"
        (click)="save()"
      >
        @if (saveBusy) {
          <mat-spinner diameter="20"></mat-spinner>
        } @else {
          保存
        }
      </button>
    </div>
  </section>
}
