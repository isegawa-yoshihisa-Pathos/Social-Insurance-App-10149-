<section class="seed-section">
  <h2 class="section-title">開発用: 月次サンプルデータ</h2>
  <p class="seed-description">
    8名 × 6か月（2026-01〜2026-06）のデータを、ログイン中の権限で Firestore に投入します。
  </p>
  <button
    mat-flat-button
    color="accent"
    type="button"
    [disabled]="busy"
    (click)="runSeed()"
  >
    @if (busy) {
      <mat-spinner diameter="20"></mat-spinner>
    } @else {
      サンプルデータ投入
    }
  </button>
  @if (message) {
    <p class="seed-message">{{ message }}</p>
  }
</section>
