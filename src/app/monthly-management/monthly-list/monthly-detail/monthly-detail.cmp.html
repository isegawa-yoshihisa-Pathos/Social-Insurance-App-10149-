<div class="monthly-detail-container">
  <div class="monthly-detail-header">
    <button mat-icon-button (click)="redirectToMonthlyManagement()" matTooltip="報酬一覧に戻る">
      <mat-icon>arrow_back</mat-icon>
    </button>
    @if (!loading()) {
      <button mat-button [matMenuTriggerFor]="employeeMenu">
        <span class="meta-value-name">{{ employeeName() || '未登録' }}</span>
        <div class="meta-item">
          <span class="meta-label">社員番号:</span>
          <span class="meta-value-id">{{ employeeId() || '---' }}</span>
        </div>
      </button>
      <mat-menu #employeeMenu="matMenu">
        @for (employee of employees(); track employee.eid) {
          <button mat-menu-item (click)="switchEmployee(employee.eid)">
            <span class="meta-value-name">{{ employee.displayName || '未登録' }}</span>
            <div class="meta-item">
              <span class="meta-label">社員番号:</span>
              <span class="meta-value-id">{{ employee.employeeId || '---' }}</span>
            </div>
          </button>
        }
      </mat-menu>
    }
  </div>

  <nav mat-tab-nav-bar [tabPanel]="tabPanel" animationDuration="0ms" class="setting-tabs">
    @if (eid(); as currentEid) {
      <a
        mat-tab-link
        [routerLink]="['/monthly-management', 'detail', currentEid, 'list']"
        [active]="isActive === 'list'"
      >
        <span>報酬詳細</span>
      </a>
      <a
        mat-tab-link
        [routerLink]="['/monthly-management', 'detail', currentEid, 'standard-remuneration']"
        [active]="isActive === 'standard-remuneration'"
      >
        <span>標準報酬月額</span>
      </a>
    }
  </nav>

  <mat-tab-nav-panel #tabPanel>
    <div class="setting-page monthly-detail-page">
      @if (loading()) {
        <mat-spinner diameter="40"></mat-spinner>
      } @else {
        <router-outlet />
      }
    </div>
  </mat-tab-nav-panel>
</div>
