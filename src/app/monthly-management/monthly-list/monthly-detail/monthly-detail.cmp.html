<div class="monthly-detail-container">
  <div class="monthly-detail-content">
    <div class="monthly-detail-header">
      <button mat-icon-button (click)="redirectToMonthlyManagement()" matTooltip="月次一覧に戻る">
        <mat-icon>arrow_back</mat-icon>
      </button>
      @if (!loading()) {
        <button mat-button [matMenuTriggerFor]="employeeMenu">
          <span class="meta-value-name">{{ employeeName() || '未登録' }}</span>
          <div class="meta-item">
            <span class="meta-label">社員番号:</span>
            <span class="meta-value-id">{{ employeeId() || '---' }}</span>
          </div>
        </button>
        <mat-menu #employeeMenu="matMenu">
          @for (employee of employees(); track employee.eid) {
            <button mat-menu-item (click)="switchEmployee(employee.eid)">
              <span class="meta-value-name">{{ employee.displayName || '未登録' }}</span>
              <div class="meta-item">
                <span class="meta-label">社員番号:</span>
                <span class="meta-value-id">{{ employee.employeeId || '---' }}</span>
              </div>
            </button>
          }
        </mat-menu>
      }
    </div>

    @if (loading()) {
      <p class="loading-message">読み込み中...</p>
    } @else if (dataSource.data.length === 0) {
      <p class="empty-message">月次レコードが見つかりません。</p>
    } @else {
      <div class="table-scroll-container">
        <table mat-table [dataSource]="dataSource" matSort class="monthly-table">
          @for (col of visibleColumns(); track col) {
            <ng-container matColumnDef="{{ col }}">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>
                {{ getColumnLabel(col) }}
              </th>
              <td mat-cell *matCellDef="let row" [class.numeric-cell]="col !== 'yyyyMm'">
                {{ formatCellValue(row, col) }}
              </td>
            </ng-container>
          }

          <tr mat-header-row *matHeaderRowDef="visibleColumns()"></tr>
          <tr mat-row *matRowDef="let row; columns: visibleColumns()"></tr>
        </table>
      </div>
    }
  </div>
</div>
