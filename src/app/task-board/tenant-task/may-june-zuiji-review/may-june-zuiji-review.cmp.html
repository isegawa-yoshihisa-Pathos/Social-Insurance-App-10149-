<div class="accept-application"> 
  <h3>5・6月昇給に伴う随時改定の確認</h3>

  @if (loading) {
    <p class="loading-message">読み込み中...</p>
  } @else if (reviews.length === 0) {
    <p class="empty-message">確認待ちの随時改定はありません。</p>
  } @else {
    <div class="review-list">
      @for (review of reviews; track review.id) {
        <div class="review-item">
          <div class="review-main">
            <div class="review-name">{{ review.employeeDisplayName || '未登録' }}</div>
            <div class="review-detail">
              {{ raiseMonthLabel(review) }}昇給 / {{ effectiveMonthLabel(review) }}適用予定
            </div>
            <div class="review-note">
              {{ reviewNote(review) }}
            </div>
          </div>
          <div class="review-actions">
            <button
              mat-button
              color="primary"
              [disabled]="busyId === review.id"
              (click)="approve(review)"
            >
              承認
            </button>
            <button
              mat-button
              [disabled]="busyId === review.id"
              (click)="reject(review)"
            >
              却下
            </button>
          </div>
        </div>
      }
    </div>
  }
</div>
