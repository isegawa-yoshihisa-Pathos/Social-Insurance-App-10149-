<nav mat-tab-nav-bar [tabPanel]="tabPanel" animationDuration="0ms">
  @if (tenant.isAdmin()) {
    <a
      mat-tab-link
      [routerLink]="['/task-board', 'tenant']"
      [active]="isTenantActive"
    >事業所</a>
  }
  <a
    mat-tab-link
    [routerLink]="['/task-board', 'personal']"
    [active]="isPersonalActive"
  >個人</a>
</nav>
<mat-tab-nav-panel #tabPanel>
  <div class="task-board">
    <router-outlet></router-outlet>
  </div>
</mat-tab-nav-panel>
