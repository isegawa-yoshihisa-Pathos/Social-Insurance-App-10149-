<div class="application-page">
  <h2>休暇申請</h2>
  <div class="help-content">
    産前休業は出産予定日の6週間（42日）前から取得可能です。多胎児の場合は14週間（98日）前から取得可能です。出産日まで延長されます。<br>
    産後休業は出産後8週間（56日）後まで取得可能です。6週間は強制的な休業です。<br>
    育児休業は養育する子が満1歳（諸条件を満たすと最長満2歳）の誕生日を迎える前日まで取得可能です。
  </div>
  <form class="input-container" (ngSubmit)="submit()">
    <div class="field-container">
      <label class="label-name">休暇種別：</label>
      <mat-form-field appearance="outline" class="field" subscriptSizing="dynamic">
        <mat-label>休暇種別</mat-label>
        <mat-select [(ngModel)]="form.type" name="type" required>
          <mat-option value="maternity">{{ leaveTypeLabels.maternity }}</mat-option>
          <mat-option value="childcare">{{ leaveTypeLabels.childcare }}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="field-container">
      <label class="label-name">開始日：</label>
      <mat-form-field appearance="outline" class="field" subscriptSizing="dynamic">
        <mat-label>開始日</mat-label>
        <input
          matInput
          [matDatepicker]="startPicker"
          [(ngModel)]="form.startAt"
          name="startAt"
          required
        />
        <mat-datepicker-toggle matIconSuffix [for]="startPicker"></mat-datepicker-toggle>
        <mat-datepicker #startPicker></mat-datepicker>
      </mat-form-field>
    </div>

    <div class="field-container">
      <label class="label-name">終了予定日：</label>
      <mat-form-field appearance="outline" class="field" subscriptSizing="dynamic">
        <mat-label>終了予定日</mat-label>
        <input
          matInput
          [matDatepicker]="endPicker"
          [(ngModel)]="form.endAt"
          name="endAt"
          [min]="form.startAt"
        />
        <mat-datepicker-toggle matIconSuffix [for]="endPicker"></mat-datepicker-toggle>
        <mat-datepicker #endPicker></mat-datepicker>
      </mat-form-field>
    </div>

    <div class="field-container">
      <label class="label-name">備考：</label>
      <mat-form-field appearance="outline" class="field" subscriptSizing="dynamic">
        <mat-label>備考</mat-label>
        <textarea matInput rows="3" [(ngModel)]="form.reason" name="reason"></textarea>
      </mat-form-field>
    </div>

    <div class="button-container">
      <button mat-flat-button color="primary" type="submit" [disabled]="submitBusy">
        @if (submitBusy) {
          <mat-spinner diameter="24" strokeWidth="3"></mat-spinner>
        } @else {
          申請する
        }
      </button>
      <button mat-button type="button" [disabled]="submitBusy" (click)="cancel()">
        キャンセル
      </button>
    </div>
  </form>
</div>
